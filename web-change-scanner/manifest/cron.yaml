apiVersion: batch/v1
kind: CronJob
metadata:
  name: detect-web-change-scanner
  namespace: samma-io
spec:
  schedule: "0 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: 0
      template:
        spec:
          containers:
          - name: web-change-scanner
            image: ghcr.io/samma-io/change-web-change-scanner:latest
            env:
              - name: TARGET
                value: "https://example.com"
              - name: WRITE_TO_FILE
                value: "True"
              - name: PARSER
                value: web-change-scanner
              - name: SAMMA_IO_SCANNER
                value: web-change-scanner
              - name: SAMMA_IO_ID
                value: "1234"
              - name: SAMMA_IO_TAGS
                value: scanner
              - name: NATS_ENABLED
                value: "False"
              - name: NATS_URL
                value: "nats://localhost:4222"
              - name: NATS_SUBJECT
                value: "samma-io.scan"
              - name: PLAYWRIGHT_TIMEOUT
                value: "30000"
              - name: PLAYWRIGHT_WAIT
                value: networkidle
            volumeMounts:
              - mountPath: /out
                name: out-volume
          volumes:
          # NOTE: emptyDir loses baseline on every pod restart (filesystem mode only).
          # For persistent baselines, replace with a PersistentVolumeClaim.
          # Recommended for production: use NATS_ENABLED=true instead.
          - name: out-volume
            emptyDir: {}
          restartPolicy: Never
